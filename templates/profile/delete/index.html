{% extends "base.html" %}

{% block title %}Ennytime Profile Page{% endblock title%}

{% block content %}
<div class="wrapper--small profile profile__wrapper">
	<h1 style="font-size: 1.5rem; font-weight: 600; color: rgb(201, 29, 135);">Delete Your Account</h1>
    <form 
        hx-delete="/profile/delete" 
        hx-target="find div" 
        hx-swap="outerHTML"
        >
        {% include "profile/delete/form-fields.html" %}
        {% include "profile/delete/submit-btn.html" %}
        <p style="margin-top: 1rem;">Don't want to delete your account? <a href="/profile" style="color: rgb(234, 6, 112); text-decoration: underline;">Back to profile</a></p>
    </form>
</div>
{% endblock content %}
